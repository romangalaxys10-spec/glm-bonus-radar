<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sweep" x1="256" y1="256" x2="480" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8533a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e8533a" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- dark tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0f1510"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#2c3326" stroke-width="8"/>
  <!-- radar rings -->
  <circle cx="256" cy="276" r="180" fill="none" stroke="#7091aa" stroke-opacity="0.30" stroke-width="14"/>
  <circle cx="256" cy="276" r="122" fill="none" stroke="#7091aa" stroke-opacity="0.45" stroke-width="14"/>
  <circle cx="256" cy="276" r="64"  fill="none" stroke="#7091aa" stroke-opacity="0.60" stroke-width="14"/>
  <!-- sweep wedge -->
  <path d="M256 276 L256 96 A180 180 0 0 1 412 186 Z" fill="url(#sweep)"/>
  <!-- crosshair -->
  <line x1="256" y1="56" x2="256" y2="120" stroke="#7091aa" stroke-opacity="0.55" stroke-width="12" stroke-linecap="round"/>
  <line x1="392" y1="276" x2="456" y2="276" stroke="#7091aa" stroke-opacity="0.55" stroke-width="12" stroke-linecap="round"/>
  <!-- golden window blip -->
  <circle cx="352" cy="180" r="34" fill="#a8822d"/>
  <circle cx="352" cy="180" r="46" fill="none" stroke="#d9a53f" stroke-width="10" stroke-opacity="0.85"/>
  <!-- center dot -->
  <circle cx="256" cy="276" r="22" fill="#edf4ee"/>
</svg>
